# Publish the verification registry (registry/site/) to GitHub Pages.
#
# The site is PREBUILT locally and committed — this workflow only uploads and
# deploys, so CI never enters the site's build/trust story. Rebuild locally with
# `node registry/build-registry.mjs` (deterministic; two builds are byte-identical).
#
# One-time repo setup (maintainer): Settings → Pages → Source: "GitHub Actions".

name: publish-registry
on:
  push:
    branches: [main]
    paths:
      - "registry/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# NOT named "pages" — that collides with GitHub's internal Pages concurrency
# group (gotcha inherited from the cred-spec render workflow).
concurrency:
  group: registry-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: registry/site
      - id: deployment
        uses: actions/deploy-pages@v4
